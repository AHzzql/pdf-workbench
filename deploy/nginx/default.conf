types { application/javascript mjs; }
log_format workbench '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
access_log /dev/stdout workbench;

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    if ($host !~ "^(localhost|127\.0\.0\.1)$") { return 400; }
    client_max_body_size 70m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
    location ~ ^/(swagger-ui(?:/|\.html)|v3/api-docs(?:/|$)) {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /part-a {
        return 302 /part-a/;
    }
    location /part-a/ {
        alias /srv/part-a/;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /(?:\.|~\$) {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
    }
}
