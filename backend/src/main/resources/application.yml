spring:
  config:
    import: optional:file:./config/application-local.yml,optional:file:./backend/config/application-local.yml
  application:
    name: pdf-workbench
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/pdf_workbench}
    username: ${DATABASE_USER:pdf_workbench}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      username: ${REDIS_USER:workbench}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    timeout: 30m
    servlet:
      filter-dispatcher-types: request
    redis:
      namespace: ${SESSION_NAMESPACE:pdf-workbench:session:v1}
      repository-type: default
      flush-mode: immediate
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 70MB
      file-size-threshold: 0
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PDF_WORKBENCH_ACCOUNT
        path: /api
        http-only: true
        same-site: lax
        secure: ${ACCOUNT_COOKIE_SECURE:false}
  tomcat:
    max-swallow-size: 70MB
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
workbench:
  max-pages: 200
  max-concurrent-jobs: 2
  max-output-bytes: 209715200
ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
  rerank-url: ${AI_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
  data-directory: ${AI_DATA_DIRECTORY:${user.home}/.pdf-workbench}
  chat-model: qwen-plus
  embedding-model: text-embedding-v3
  rerank-model: gte-rerank-v2
logging:
  level:
    org.springframework.ai: OFF
